<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V-Taper Weekly System</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white: #ffffff;
    --bg: #f4f5f7;
    --border: #e8eaed;
    --text: #111827;
    --muted: #6b7280;
    --subtle: #9ca3af;
    --card-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
    --card-shadow-hover: 0 8px 24px rgba(0,0,0,0.10), 0 0 0 1px rgba(0,0,0,0.04);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .header h1 em { font-style: italic; color: #16a34a; }
  .badge-split {
    background: #dcfce7;
    color: #15803d;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .header-meta {
    margin-left: auto;
    font-size: 11px;
    color: var(--subtle);
    letter-spacing: 0.3px;
  }

  /* ── Main Layout ── */
  .main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* ── Day Tabs ── */
  .day-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 20px;
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex-shrink: 0;
    min-width: 76px;
    padding: 11px 14px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--white);
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-align: center;
    transition: all 0.18s cubic-bezier(0.4,0,0.2,1);
    box-shadow: var(--card-shadow);
  }
  .day-tab:hover { box-shadow: var(--card-shadow-hover); transform: translateY(-1px); }
  .day-tab .tab-day { font-size: 13px; font-weight: 800; display: block; }
  .day-tab .tab-label { font-size: 9px; font-weight: 400; margin-top: 2px; opacity: 0.75; display: block; }
  .day-tab.active {
    color: #fff;
    border-color: transparent;
  }

  /* ── Day Header Card ── */
  .day-header {
    background: var(--white);
    border-radius: 18px;
    padding: 22px 26px;
    margin-bottom: 16px;
    box-shadow: var(--card-shadow);
    border-left: 5px solid #16a34a;
    transition: border-color 0.3s;
    animation: fadeSlide 0.25s ease;
  }
  .day-header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .day-focus {
    font-family: 'DM Serif Display', serif;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: -0.3px;
  }
  .day-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .day-goal {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
    border-left: 3px solid currentColor;
    padding-left: 12px;
    margin-top: 2px;
  }

  /* ── Exercise Cards ── */
  .exercises {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
    animation: fadeSlide 0.3s ease;
  }
  .ex-card {
    background: var(--white);
    border-radius: 14px;
    border: 1px solid var(--border);
    display: flex;
    align-items: stretch;
    overflow: hidden;
    box-shadow: var(--card-shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .ex-card:hover { transform: translateY(-2px); box-shadow: var(--card-shadow-hover); }

  .ex-img-wrap {
    width: 116px;
    min-width: 116px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    border-right: 1px solid var(--border);
    position: relative;
  }
  .ex-num {
    position: absolute;
    top: 7px;
    left: 10px;
    font-size: 10px;
    font-weight: 800;
    opacity: 0.45;
    letter-spacing: 0.5px;
  }
  .ex-img {
    width: 84px;
    height: 84px;
    object-fit: contain;
    display: block;
  }
  .ex-img-fallback { font-size: 36px; line-height: 1; }

  .ex-body {
    flex: 1;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
  }
  .ex-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .ex-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }
  .ex-badges {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .badge-sets {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .badge-rest {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    background: #f1f5f9;
    color: #64748b;
  }
  .ex-note {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    border-left: 3px solid transparent;
    padding-left: 10px;
  }

  /* ── Principles ── */
  .section-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--subtle);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .principles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }
  .principle-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--card-shadow);
  }
  .principle-icon { font-size: 22px; margin-bottom: 10px; }
  .principle-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 5px; }
  .principle-desc { font-size: 11px; color: var(--muted); line-height: 1.6; }

  /* ── Week Overview ── */
  .week-overview {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 24px;
    box-shadow: var(--card-shadow);
  }
  .week-grid {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .week-cell {
    flex: 1;
    min-width: 66px;
    padding: 10px 6px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--subtle);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.5px;
    transition: all 0.18s ease;
  }
  .week-cell:hover { border-color: #94a3b8; color: var(--text); }
  .week-cell .wc-day { display: block; font-size: 12px; font-weight: 800; }
  .week-cell .wc-focus { display: block; font-size: 9px; font-weight: 400; margin-top: 3px; }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Responsive ── */
  @media (max-width: 500px) {
    .header h1 { font-size: 18px; }
    .header-meta { display: none; }
    .ex-img-wrap { width: 90px; min-width: 90px; }
    .ex-img { width: 68px; height: 68px; }
    .day-focus { font-size: 20px; }
  }
</style>
</head>

<header class="header">

let activeDay = 0;

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function renderTabs() {
  const container = document.getElementById('dayTabs');
  container.innerHTML = days.map((d,i) => `
    <button class="day-tab${i===activeDay?' active':''}"
      onclick="selectDay(${i})"
      style="${i===activeDay ? `background:${d.color};box-shadow:0 4px 14px rgba(${hexToRgb(d.color)},0.35);border-color:${d.color};` : ''}">
      <span class="tab-day">${d.day}</span>
      <span class="tab-label">${d.focus.split('—')[0].trim().split(' ')[0]}</span>
    </button>
  `).join('');
}

function renderDayHeader() {
  const d = days[activeDay];
  document.getElementById('dayHeader').style.borderLeftColor = d.color;
  document.getElementById('dayHeader').innerHTML = `
    <div class="day-header-top">
      <span class="day-focus" style="color:${d.color}">${d.focus}</span>
      <span class="day-tag" style="background:${d.tagBg};color:${d.tagColor}">${d.tag}</span>
    </div>
    <p class="day-goal" style="color:${d.color}">${d.goal}</p>
  `;
}

function renderExercises() {
  const d = days[activeDay];
  document.getElementById('exercises').innerHTML = d.exercises.map((ex,i) => {
    const src = imgMap[ex.name] || '';
    return `
    <div class="ex-card">
      <div class="ex-img-wrap" style="background:${d.lightBg}">
        <span class="ex-num" style="color:${d.color}">${String(i+1).padStart(2,'0')}</span>
        ${src
          ? `<img class="ex-img" src="${src}" alt="${ex.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`
          : ''}
        <span class="ex-img-fallback" style="${src?'display:none':''}">🏋️</span>
      </div>
      <div class="ex-body">
        <div class="ex-top">
          <span class="ex-name">${ex.name}</span>
          <div class="ex-badges">
            <span class="badge-sets" style="background:${d.color}18;color:${d.color}">${ex.sets} × ${ex.reps}</span>
            <span class="badge-rest">⏱ ${ex.rest}</span>
          </div>
        </div>
        <p class="ex-note" style="border-left-color:${d.color}">${ex.note}</p>
      </div>
    </div>`;
  }).join('');
}

function renderPrinciples() {
  document.getElementById('principles').innerHTML = principles.map(p => `
    <div class="principle-card">
      <div class="principle-icon">${p.icon}</div>
      <div class="principle-title">${p.title}</div>
      <p class="principle-desc">${p.desc}</p>
    </div>
  `).join('');
}

function renderWeekGrid() {
  document.getElementById('weekGrid').innerHTML = days.map((d,i) => `
    <button class="week-cell" onclick="selectDay(${i})"
      style="${i===activeDay ? `border-color:${d.color};color:${d.color};background:${d.lightBg};font-weight:800;` : ''}">
      <span class="wc-day">${d.day}</span>
      <span class="wc-focus">${d.focus.split('—')[0].trim().split(' ')[0]}</span>
    </button>
  `).join('');
}

function selectDay(i) {
  activeDay = i;
  renderTabs();
  renderDayHeader();
  renderExercises();
  renderWeekGrid();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Auto-select today
const todayMap = { 1:0, 2:1, 3:2, 4:3, 5:4, 6:5, 0:6 };
activeDay = todayMap[new Date().getDay()] ?? 0;

renderTabs();
renderDayHeader();
renderExercises();
renderPrinciples();
renderWeekGrid();
</script>
</body>
</html>
